name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck and Bats
        run: sudo apt-get update && sudo apt-get install --yes shellcheck bats

      - name: Check Bash syntax
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Bats tests
        run: bats tests/

      - name: Validate Docker Compose example
        run: docker compose -f compose-examples/docker-compose.example.yml config

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .git './**/*.md'
          fail: true
