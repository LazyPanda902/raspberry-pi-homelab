# Sanitized Docker Compose example.
# This file is for portfolio documentation only.
# Replace placeholder values before using.

services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./appdata/glance:/app/config

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./appdata/uptime-kuma:/app/data

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./appdata/portainer:/data

  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    restart: unless-stopped
    ports:
      - "3003:3000"
      # DNS ports are intentionally omitted in this public example.
      # Add them only in your private compose file.
    volumes:
      - ./appdata/adguard/work:/opt/adguardhome/work
      - ./appdata/adguard/conf:/opt/adguardhome/conf
