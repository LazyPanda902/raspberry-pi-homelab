# Sanitized teaching example. It is not copied from the live host.
name: homelab-example

services:
  dashboard:
    image: glanceapp/glance:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - dashboard-data:/app/config
    read_only: true
    tmpfs:
      - /tmp

  availability-monitor:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - monitor-data:/app/data

  metrics:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./example-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics-data:/prometheus
    expose:
      - "9090"

volumes:
  dashboard-data:
  monitor-data:
  metrics-data:
